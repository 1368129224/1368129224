# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Schedule updates (daily)
  schedule:
    - cron: "0 3 * * *"
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push:
    branches: [main]

# Never let two runs fight over the same commit on main
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned instead of @latest: @latest currently resolves to the v3.34-beta prerelease.
      # output_action: none -> metrics only renders /metrics_renders/github-metrics.svg and
      # leaves the commit to the last step, so the svg can be padded before it is published.
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none

          # Options
          user: "1368129224"
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          filename: github-metrics.svg

          # Commit calendar (half year)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Most used languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

      - uses: actions/checkout@v4

      # metrics sizes the canvas with its own font metrics (height="693"). Browsers whose
      # minimum font size is larger than the 10px footer lay that footer out taller, so
      # "Last updated ..." lands past the canvas bottom and gets cut in half.
      # Give the canvas 80px of extra room: the svg has no background, so the added area
      # is transparent and costs nothing visually.
      - name: Commit padded svg
        run: |
          set -euo pipefail
          cp /metrics_renders/github-metrics.svg github-metrics.svg

          height=$(head -n 1 github-metrics.svg | grep -o 'height="[0-9]*"' | head -n 1 | tr -dc '0-9' || true)
          if [ -z "$height" ]; then
            echo "::error::could not read the svg height"
            exit 1
          fi
          if [ "$height" -lt 760 ]; then
            sed -i "1s/height=\"$height\"/height=\"$((height + 80))\"/" github-metrics.svg
            echo "height: $height -> $((height + 80))"
          else
            echo "height: $height (already padded)"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          if git diff --cached --quiet; then
            echo "github-metrics.svg is unchanged"
            exit 0
          fi
          git commit -m "Update github-metrics.svg [skip ci]"
          git push
