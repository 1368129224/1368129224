# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Schedule updates (daily)
  schedule: [{cron: "0 3 * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned instead of @latest: "@latest" currently resolves to the v3.34-beta prerelease.
      # commit:false -> the commit is made below, after the SVG has been padded once.
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          commit: false

          # Options
          user: "1368129224"
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          filename: github-metrics.svg

          # Commit calendar (half year)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Most used languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

      # metrics bakes the canvas height (693) using its own font metrics. Browsers whose
      # minimum font size is above metrics' 10px footer lay that footer out taller, so
      # "Last updated ..." ends up past the canvas bottom and is cut in half.
      # Pad the canvas below the content: the SVG has no background, so the extra area is
      # transparent and costs nothing visually, while the footer always stays visible.
      - name: Pad github-metrics.svg and commit
        run: |
          python3 - <<'PY'
          import pathlib, re

          path = pathlib.Path("github-metrics.svg")
          if not path.exists():
              raise SystemExit("github-metrics.svg was not generated")
          svg = path.read_text(encoding="utf-8")
          match = re.search(r'<svg\b[^>]*?\bheight="(\d+)"', svg)
          if not match:
              raise SystemExit("cannot locate the svg height attribute")
          height = int(match.group(1))
          if height < 760:
              svg = svg[:match.start(1)] + str(height + 80) + svg[match.end(1):]
              path.write_text(svg, encoding="utf-8")
              print(f"height {height} -> {height + 80}")
          else:
              print(f"height {height} already padded")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          if git diff --cached --quiet; then
            echo "github-metrics.svg unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Update github-metrics.svg [skip ci]"
          git push
